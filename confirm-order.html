<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Flavor Junction | Confirm Your Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #F7F9FC 0%, #EEF2F7 100%);
      font-family: 'Inter', sans-serif;
      color: #1E2A32;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Main confirmation container */
    .confirmation-container {
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header with back button */
    .confirmation-header {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .back-btn:hover {
      background: #2B9348;
      color: white;
      transform: translateX(-3px);
    }
    .back-btn i {
      font-size: 1.2rem;
      color: #2B9348;
    }
    .back-btn:hover i {
      color: white;
    }
    .confirmation-header h1 {
      font-family: 'Jost', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #1F2A3E;
      letter-spacing: -0.3px;
    }

    /* Order card */
    .order-card {
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* Order items section */
    .order-items {
      padding: 32px 28px;
      border-bottom: 1px solid #F0E6DD;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #F5F0EB;
    }
    .order-item:last-child {
      border-bottom: none;
    }

    .item-details {
      flex: 1;
    }
    .item-name {
      font-weight: 700;
      font-size: 1rem;
      color: #1E2A32;
      margin-bottom: 4px;
    }
    .item-quantity {
      font-size: 0.75rem;
      color: #8D9DB0;
      font-weight: 500;
    }
    .item-price {
      font-weight: 700;
      font-size: 1rem;
      color: #2B9348;
    }

    /* Summary section */
    .order-summary {
      padding: 24px 28px;
      background: #FAFBFD;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 0.95rem;
    }
    .summary-line.subtotal {
      color: #4A5B6E;
    }
    .summary-line.tax {
      color: #4A5B6E;
      border-bottom: 1px solid #E8EDF2;
      padding-bottom: 14px;
      margin-bottom: 6px;
    }
    .summary-line.total {
      font-weight: 800;
      font-size: 1.2rem;
      color: #2B9348;
      padding-top: 8px;
    }
    .summary-line.total .label {
      font-size: 1rem;
    }

    /* Payment method section */
    .payment-section {
      padding: 28px;
      background: #FFF8F2;
      border-top: 1px solid #F0E6DD;
    }
    .payment-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #F97316;
      margin-bottom: 12px;
    }
    .payment-title i {
      font-size: 1.1rem;
    }
    .payment-message {
      font-size: 0.85rem;
      color: #5C6F87;
      line-height: 1.5;
      background: white;
      padding: 14px 16px;
      border-radius: 16px;
      border-left: 3px solid #F97316;
    }

    /* Place Order Button */
    .place-order-btn {
      width: 100%;
      background: #2B9348;
      border: none;
      border-radius: 28px;
      padding: 16px;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      margin-top: 16px;
      font-family: 'Inter', sans-serif;
    }
    .place-order-btn:hover {
      background: #1f6e38;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(43, 147, 72, 0.3);
    }
    .place-order-btn:active {
      transform: scale(0.98);
    }

    /* Success toast / modal */
    .success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .success-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .success-modal {
      background: white;
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      animation: scaleIn 0.3s ease-out;
    }
    @keyframes scaleIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    .success-icon {
      width: 70px;
      height: 70px;
      background: #2B9348;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .success-icon i {
      font-size: 2.5rem;
      color: white;
    }
    .success-modal h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #1E2A32;
    }
    .success-modal p {
      color: #6B7A8A;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .continue-btn {
      background: #2B9348;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    /* Empty state */
    .empty-order {
      text-align: center;
      padding: 60px 28px;
    }
    .empty-order i {
      font-size: 4rem;
      color: #CBD5E1;
      margin-bottom: 16px;
    }
    .empty-order p {
      color: #8D9DB0;
      margin-bottom: 24px;
    }
    .return-btn {
      background: #2B9348;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .order-items {
        padding: 24px 20px;
      }
      .order-summary {
        padding: 20px;
      }
      .payment-section {
        padding: 20px;
      }
      .confirmation-header h1 {
        font-size: 24px;
      }
    }

    /* Footer note */
    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.7rem;
      color: #94A3B8;
    }
  </style>
</head>
<body>
<div class="confirmation-container" id="confirmationPage">
  <!-- Header with back button -->
  <div class="confirmation-header">
    <button class="back-btn" onclick="goBackToMenu()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1>Confirm Your Order</h1>
  </div>

  <div class="order-card" id="orderCard">
    <!-- Dynamic content will be injected here -->
    <div id="orderContent"></div>
  </div>
  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> Secure checkout • Order tracking available
  </div>
</div>

<!-- Success Modal -->
<div class="success-overlay" id="successOverlay">
  <div class="success-modal">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>
    <h3>Order Placed! 🎉</h3>
    <p>Your order has been received and is being prepared. You'll receive a confirmation shortly.</p>
    <button class="continue-btn" onclick="goToMenuAndReset()">Continue Browsing</button>
  </div>
</div>

<script>
  // Retrieve cart data from sessionStorage (passed from menu page)
  let orderCart = [];
  
  // Load cart data from storage
  function loadCartData() {
    const savedCart = sessionStorage.getItem('flavorJunctionCart');
    if (savedCart) {
      try {
        orderCart = JSON.parse(savedCart);
      } catch(e) {
        console.error('Error parsing cart data');
        orderCart = [];
      }
    }
    
    // If still empty, try to get from URL parameters (fallback)
    if (orderCart.length === 0) {
      const urlParams = new URLSearchParams(window.location.search);
      const cartParam = urlParams.get('cart');
      if (cartParam) {
        try {
          orderCart = JSON.parse(decodeURIComponent(cartParam));
        } catch(e) {}
      }
    }
    
    // Fallback demo data if nothing exists
    if (orderCart.length === 0) {
      orderCart = [
        { id: 'l1', name: 'Kerala Biryani', price: 179, quantity: 1 },
        { id: 'l3', name: 'Meals', price: 79, quantity: 1 },
        { id: 'j3', name: 'Grape Juice', price: 79, quantity: 2 }
      ];
    }
    
    renderOrderConfirmation();
  }
  
  // Render the order confirmation UI
  function renderOrderConfirmation() {
    const orderContent = document.getElementById('orderContent');
    if (!orderContent) return;
    
    if (!orderCart || orderCart.length === 0) {
      orderContent.innerHTML = `
        <div class="empty-order">
          <i class="fas fa-shopping-cart"></i>
          <p>Your cart is empty. Add some delicious items first!</p>
          <button class="return-btn" onclick="goBackToMenu()">
            <i class="fas fa-arrow-left"></i> Back to Menu
          </button>
        </div>
      `;
      return;
    }
    
    // Calculate totals
    const subtotal = orderCart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const tax = subtotal * 0.05;
    const total = subtotal + tax;
    
    // Build order items HTML
    const itemsHtml = orderCart.map(item => `
      <div class="order-item">
        <div class="item-details">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-quantity">Quantity: ${item.quantity}</div>
        </div>
        <div class="item-price">₹ ${(item.price * item.quantity).toFixed(2)}</div>
      </div>
    `).join('');
    
    orderContent.innerHTML = `
      <div class="order-items">
        ${itemsHtml}
      </div>
      <div class="order-summary">
        <div class="summary-line subtotal">
          <span>Subtotal</span>
          <span>₹ ${subtotal.toFixed(2)}</span>
        </div>
        <div class="summary-line tax">
          <span>Tax (GST 5%)</span>
          <span>₹ ${tax.toFixed(2)}</span>
        </div>
        <div class="summary-line total">
          <span class="label">Total</span>
          <span>₹ ${total.toFixed(2)}</span>
        </div>
      </div>
      <div class="payment-section">
        <div class="payment-title">
          <i class="fas fa-wallet"></i>
          <span>Payment Method</span>
        </div>
        <div class="payment-message">
          <i class="fas fa-info-circle" style="margin-right: 8px; color: #F97316;"></i>
          Payment has to be done when the order is picked up!
        </div>
      </div>
      <div style="padding: 0 28px 28px 28px;">
        <button class="place-order-btn" onclick="placeOrder()">
          <i class="fas fa-check-circle"></i> Place Order
        </button>
      </div>
    `;
  }
  
  // Escape HTML to prevent XSS
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  // Place order action
  function placeOrder() {
    // Show success modal
    const overlay = document.getElementById('successOverlay');
    if (overlay) {
      overlay.classList.add('active');
    }
    
    // Clear the cart from sessionStorage after successful order
    sessionStorage.removeItem('flavorJunctionCart');
    
    // Optional: You could also send order data to backend here
    console.log('Order placed:', orderCart);
  }
  
  // Go back to menu page
  function goBackToMenu() {
    window.location.href = 'menu.html'; // Adjust to your menu page filename
  }
  
  // Continue browsing after order (clears cart and goes to menu)
  function goToMenuAndReset() {
    // Clear cart data to ensure fresh start
    sessionStorage.removeItem('flavorJunctionCart');
    window.location.href = 'menu.html';
  }
  
  // Close modal if clicked outside (optional)
  document.addEventListener('click', function(e) {
    const overlay = document.getElementById('successOverlay');
    if (e.target === overlay) {
      overlay.classList.remove('active');
    }
  });
  
  // Load data when page loads
  window.addEventListener('DOMContentLoaded', loadCartData);
  
  // Make functions globally accessible for inline onclick handlers
  window.goBackToMenu = goBackToMenu;
  window.placeOrder = placeOrder;
  window.goToMenuAndReset = goToMenuAndReset;
</script>
</body>
</html>
