<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Canteen - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .login-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 2.5rem 2rem 2.8rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            outline: none;
            background-color: #ffffff;
            color: #0f172a;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
        }

        .login-btn {
            width: 100%;
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 0.9rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            transition: all 0.25s ease;
        }

        .login-btn:hover {
            background-color: #0f172a;
            transform: scale(0.98);
        }

        .forgot-link {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #5b6e8c;
            text-decoration: none;
            margin-bottom: 1.8rem;
        }

        .forgot-link:hover {
            color: #1e293b;
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background: #eef2f6;
            margin: 1.5rem 0 1.5rem 0;
        }

        .signup-btn {
            width: 100%;
            background: transparent;
            border: 1.5px solid #e2e8f0;
            padding: 0.85rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            color: #334155;
            transition: all 0.2s ease;
        }

        .signup-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        /* Error message styling */
        .error-message {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: -0.75rem;
            margin-bottom: 0.75rem;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body style="background-image: url('images/background.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

<div class="login-container">
    <div class="login-card">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="emailInput" placeholder="Email/student ID" required>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            <div class="error-message" id="errorMessage">Invalid email or password. Please try again.</div>
            <button type="submit" class="login-btn">Login</button>
            <a href="#" class="forgot-link">Forgot password? Click here</a>
            <div class="divider"></div>
            <button type="button" class="signup-btn">Don't have an account? Sign up</button>
        </form>
    </div>
</div>

<script>
    // Get form elements
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMessage = document.getElementById('errorMessage');
    
    // Handle login form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Get input values
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        // Check for specific credentials
        if (email === "projectcanteen@gmail.com" && password === "12345678") {
            // Redirect to menu.html
            window.location.href = "menu.html";
        } else {
            // Show error message
            errorMessage.classList.add('show');
            
            // Clear password field for security
            passwordInput.value = '';
            
            // Optional: shake animation for error
            const loginCard = document.querySelector('.login-card');
            loginCard.style.transform = 'translateX(5px)';
            setTimeout(() => {
                loginCard.style.transform = 'translateX(-5px)';
            }, 50);
            setTimeout(() => {
                loginCard.style.transform = 'translateX(3px)';
            }, 100);
            setTimeout(() => {
                loginCard.style.transform = 'translateX(-3px)';
            }, 150);
            setTimeout(() => {
                loginCard.style.transform = 'translateX(0)';
            }, 200);
        }
    });
    
    // Clear error message when user starts typing again
    emailInput.addEventListener('input', function() {
        errorMessage.classList.remove('show');
    });
    
    passwordInput.addEventListener('input', function() {
        errorMessage.classList.remove('show');
    });
    
    // Forgot password handler
    document.querySelector('.forgot-link')?.addEventListener('click', function(e) {
        e.preventDefault();
        alert('Password reset link will be sent to your registered email.');
    });
    
    // Sign up button handler
    document.querySelector('.signup-btn')?.addEventListener('click', function() {
        alert('Create a new account to get started with College Canteen!');
    });
</script>

</body>
</html>
