<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Canteen - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Combines the background image and the dark overlay from your CSS */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Login Card Container */
        .login-box {
            background-color: #F5F5F5;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 10px; /* Your requested radius */
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px; /* Your requested radius */
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
        }

        /* Error message styling from HTML code */
        .error-message {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Buttons */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #2DCC70; /* Your Green Code */
            color: white;
            border: none;
            border-radius: 10px; /* Your requested radius */
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.25s ease;
        }

        .login-btn:hover {
            filter: brightness(90%);
            transform: scale(0.98);
        }

        .forgot-pass {
            display: block;
            margin-top: 10px;
            font-size: 10px;
            color: red;
            text-decoration: none;
            text-align: left;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        .signup-link {
            width: 100%;
            background: white;
            border: 1px solid #000;
            padding: 10px;
            border-radius: 10px;
            margin-top: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .signup-link:hover {
            background-color: #f8fafc;
        }

        .divider {
            height: 1px;
            background: #eef2f6;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Login</h1>
    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="emailInput" placeholder="Email/student ID" required>
        </div>
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Password" required>
        </div>
        
        <!-- Logic for error display -->
        <div class="error-message" id="errorMessage">Invalid email or password. Please try again.</div>
        
        <a href="#" class="forgot-pass">Forgot password? Click here</a>
        
        <button type="submit" class="login-btn">Login</button>
        
        <div class="divider"></div>
        
        <button type="button" class="signup-link">Don't have an account? Sign up</button>
    </form>
</div>

<script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMessage = document.getElementById('errorMessage');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        // Credentials check
        if (email === "projectcanteen@gmail.com" && password === "12345678") {
            window.location.href = "menu.html";
        } else {
            errorMessage.classList.add('show');
            passwordInput.value = '';
            
            // Shake effect logic
            const loginCard = document.querySelector('.login-box');
            loginCard.style.transition = 'transform 0.1s';
            
            const sequence = [5, -5, 3, -3, 0];
            sequence.forEach((pos, i) => {
                setTimeout(() => {
                    loginCard.style.transform = `translateX(${pos}px)`;
                }, i * 50);
            });
        }
    });
    
    // Clear error on type
    [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => errorMessage.classList.remove('show'));
    });
    
    document.querySelector('.forgot-pass').addEventListener('click', (e) => {
        e.preventDefault();
        alert('Password reset link will be sent to your registered email.');
    });

    document.querySelector('.signup-link').addEventListener('click', () => {
        alert('Create a new account to get started with College Canteen!');
    });
</script>

</body>
</html>
