<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flavor Junction | My Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #F7F9FC 0%, #EEF2F7 100%);
      font-family: 'Inter', sans-serif;
      color: #1E2A32;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .back-btn:hover {
      background: #2B9348;
      transform: translateX(-3px);
    }
    .back-btn:hover i {
      color: white;
    }
    .back-btn i {
      font-size: 1.2rem;
      color: #2B9348;
      transition: 0.2s;
    }
    h1 {
      font-family: 'Jost', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #1F2A3E;
    }
    .order-count {
      background: #2B9348;
      color: white;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Order Card */
    .order-card {
      background: white;
      border-radius: 28px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .order-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
    }

    .order-header {
      background: #2B9348;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .order-number {
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .order-number i {
      font-size: 1.3rem;
    }
    .order-status {
      background: rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
    }
    .order-time {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.8);
    }

    .order-body {
      padding: 24px;
    }

    .order-items-list {
      margin-bottom: 20px;
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #F0E6DD;
    }
    .order-item-name {
      font-weight: 500;
      font-size: 0.95rem;
    }
    .order-item-qty {
      color: #8D9DB0;
      font-size: 0.8rem;
      margin-left: 8px;
    }
    .order-item-price {
      font-weight: 600;
      color: #2B9348;
    }

    /* Status Message */
    .status-message {
      background: #FFF8F2;
      padding: 16px 20px;
      border-radius: 20px;
      margin: 16px 0;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-left: 4px solid #F97316;
    }
    .status-message i {
      font-size: 1.8rem;
      color: #F97316;
    }
    .status-text {
      flex: 1;
    }
    .status-text p {
      font-weight: 500;
      margin-bottom: 4px;
    }
    .status-text small {
      color: #8D9DB0;
      font-size: 0.75rem;
    }
    .estimated-time {
      background: #F0F7F2;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #2B9348;
    }

    /* Order Summary */
    .order-summary {
      background: #FAFBFD;
      padding: 16px 20px;
      border-radius: 16px;
      margin-top: 16px;
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.85rem;
    }
    .summary-line.total {
      font-weight: 700;
      font-size: 1rem;
      border-top: 1px solid #E2E8F0;
      padding-top: 10px;
      margin-top: 6px;
      color: #2B9348;
    }

    /* Home Button */
    .home-btn {
      width: 100%;
      background: #2B9348;
      border: none;
      border-radius: 28px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 20px;
    }
    .home-btn:hover {
      background: #1f6e38;
      transform: scale(1.02);
    }

    /* Empty state */
    .empty-orders {
      text-align: center;
      padding: 60px 28px;
      background: white;
      border-radius: 28px;
    }
    .empty-orders i {
      font-size: 4rem;
      color: #CBD5E1;
      margin-bottom: 16px;
    }
    .empty-orders p {
      color: #8D9DB0;
      margin-bottom: 24px;
    }

    /* Loading animation */
    .loading {
      text-align: center;
      padding: 60px;
    }
    .loading i {
      font-size: 2rem;
      color: #2B9348;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 16px;
      }
      h1 {
        font-size: 24px;
      }
      .order-header {
        padding: 14px 18px;
      }
      .order-body {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="goToMenu()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1>My Orders</h1>
    </div>
    <div class="order-count" id="orderCount">0 orders</div>
  </div>

  <div id="ordersList"></div>

  <button class="home-btn" onclick="goToMenu()">
    <i class="fas fa-home"></i> Back to Menu
  </button>
</div>

<script>
  // Load orders from localStorage
  function loadOrders() {
    const ordersList = document.getElementById('ordersList');
    const orderCountSpan = document.getElementById('orderCount');
    
    const orders = JSON.parse(localStorage.getItem('flavorJunctionOrders') || '[]');
    
    if (orders.length === 0) {
      ordersList.innerHTML = `
        <div class="empty-orders">
          <i class="fas fa-receipt"></i>
          <p>No orders yet. Start ordering some delicious food!</p>
          <button class="home-btn" onclick="goToMenu()" style="width: auto; display: inline-flex; padding: 10px 24px;">
            <i class="fas fa-utensils"></i> Browse Menu
          </button>
        </div>
      `;
      orderCountSpan.textContent = '0 orders';
      return;
    }
    
    // Sort orders by timestamp (newest first)
    orders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    orderCountSpan.textContent = `${orders.length} order${orders.length !== 1 ? 's' : ''}`;
    
    ordersList.innerHTML = orders.map(order => `
      <div class="order-card">
        <div class="order-header">
          <div class="order-number">
            <i class="fas fa-hashtag"></i>
            Order #${order.orderNumber}
          </div>
          <div class="order-status">
            <i class="fas fa-clock"></i> ${order.status === 'preparing' ? 'Preparing' : 'Ready'}
          </div>
          <div class="order-time">
            ${formatDate(order.timestamp)}
          </div>
        </div>
        <div class="order-body">
          <div class="order-items-list">
            ${order.items.map(item => `
              <div class="order-item-row">
                <div>
                  <span class="order-item-name">${escapeHtml(item.name)}</span>
                  <span class="order-item-qty">x ${item.quantity}</span>
                </div>
                <div class="order-item-price">₹ ${(item.price * item.quantity).toFixed(2)}</div>
              </div>
            `).join('')}
          </div>
          
          <div class="status-message">
            <i class="fas fa-hourglass-half"></i>
            <div class="status-text">
              <p>Your Order is getting ready please wait</p>
              <small>Order confirmed and being prepared by our chefs</small>
            </div>
            <div class="estimated-time">
              <i class="fas fa-stopwatch"></i> ${order.estimatedTime || 20} mins
            </div>
          </div>
          
          <div class="order-summary">
            <div class="summary-line">
              <span>Subtotal</span>
              <span>₹ ${(order.subtotal || order.items.reduce((s, i) => s + i.price * i.quantity, 0)).toFixed(2)}</span>
            </div>
            <div class="summary-line">
              <span>Tax (GST 5%)</span>
              <span>₹ ${(order.gst || order.items.reduce((s, i) => s + i.price * i.quantity, 0) * 0.05).toFixed(2)}</span>
            </div>
            <div class="summary-line total">
              <span>Total</span>
              <span>₹ ${(order.total || order.items.reduce((s, i) => s + i.price * i.quantity, 0) * 1.05).toFixed(2)}</span>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }
  
  function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} min ago`;
    if (diffHours < 24) return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
    return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function goToMenu() {
    window.location.href = 'menu.html';
  }
  
  // Load orders when page loads
  document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
